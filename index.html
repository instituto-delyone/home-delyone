<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>Agenda · Delyone Home</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111d2e;--panel2:#17263a;--line:#263b54;--text:#edf4ff;--muted:#91a4bd;--accent:#9bcaff;--accent2:#b7a7ff;--danger:#ff9caa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 18% -10%,#24466c 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1240px;margin:auto;padding:26px 22px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border:1px solid #426486;border-radius:13px;background:linear-gradient(145deg,#294c70,#20294b);display:grid;place-items:center;color:#d5eaff;font-size:21px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}.brand h1{font-size:21px;letter-spacing:-.04em;margin:1px 0}.hint{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #38516d;border-radius:10px;padding:10px 13px;background:#1b3048;color:#e4f1ff}.btn.primary{background:linear-gradient(135deg,#9bcaff,#b8adff);border:0;color:#101827;font-weight:750}.btn.ghost{background:transparent}.btn.danger{color:var(--danger);border-color:#67404d;background:#2a1b27}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.panel{border:1px solid var(--line);background:linear-gradient(155deg,#142338,#101a2a);border-radius:17px;overflow:hidden}.list-panel{padding:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-head h2{font-size:13px;margin:0}.count{color:var(--muted);font-size:11px}.search{width:100%;border:1px solid var(--line);border-radius:10px;background:#0b1625;color:var(--text);padding:10px 12px;outline:none;margin-bottom:12px}.notes{display:grid;gap:7px}.note{width:100%;text-align:left;border:1px solid transparent;border-radius:11px;padding:11px;background:#0d1929;color:var(--text)}.note:hover,.note.active{border-color:#45688c;background:#1a2d44}.note strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.empty-list{padding:22px 10px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:11px}.editor{padding:20px}.editor-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.state{font-size:11px;color:var(--muted)}.state:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#83d6ad;margin-right:7px}.title{width:100%;border:0;border-bottom:1px solid var(--line);padding:8px 0 15px;background:transparent;color:var(--text);font-size:25px;font-weight:700;letter-spacing:-.04em;outline:none}.body{width:100%;min-height:55vh;resize:vertical;border:0;background:transparent;color:#dce8f7;padding:18px 0;outline:none;font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}.editor-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:13px;color:var(--muted);font-size:11px}.foot-actions{display:flex;gap:8px;flex-wrap:wrap}.mobile-new{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d7eaff;color:#101827;padding:10px 15px;border-radius:10px;font-weight:650;box-shadow:0 12px 40px #0008;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:760px){.app{padding:17px 12px}.top{align-items:flex-start}.top-actions .btn{padding:9px 10px}.layout{grid-template-columns:1fr}.list-panel{order:2}.editor{order:1}.body{min-height:38vh}.mobile-new{display:inline-flex}.title{font-size:21px}.editor{padding:16px}.brand h1{font-size:18px}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">▤</div><div><div class="eyebrow">Delyone Home · Personal workspace</div><h1>Agenda</h1><div class="hint">Um espaço simples para organizar suas ideias.</div></div></div><div class="top-actions"><button class="btn ghost" id="exportAll">Exportar notas</button><button class="btn primary" id="newTop">＋ Nova nota</button></div></header>
<div class="layout">
<aside class="panel list-panel"><div class="panel-head"><h2>MINHAS ANOTAÇÕES</h2><span class="count" id="count">0 notas</span></div><input class="search" id="search" placeholder="Buscar nas notas…"><div class="notes" id="notes"></div></aside>
<section class="panel editor"><div class="editor-top"><span class="state" id="state">Pronto para escrever</span><button class="btn mobile-new" id="newMobile">＋ Nova</button></div>
<input class="title" id="title" maxlength="120" placeholder="Título da anotação">
<textarea class="body" id="body" placeholder="Comece a escrever…"></textarea>
<div class="editor-foot"><span id="updated">Salvamento manual · Este navegador</span><div class="foot-actions"><button class="btn danger" id="remove" disabled>Excluir</button><button class="btn primary" id="save">Salvar página</button></div></div></section>
</div></main><div class="toast" id="toast"></div>
<script>
(()=>{const KEY="delyone.agenda.local.v1";let notes=[],current=null;const $=id=>document.getElementById(id);
const safe=(v)=>String(v??"");function load(){try{notes=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(notes))notes=[];}catch{notes=[];}render();}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes));}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2100);}
function stamp(v){return new Date(v).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});}
function render(){const q=$("search").value.toLowerCase();const list=$("notes");list.innerHTML="";const visible=notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);$("count").textContent=notes.length+" "+(notes.length===1?"nota":"notas");if(!visible.length){const e=document.createElement("div");e.className="empty-list";e.textContent=notes.length?"Nenhuma nota encontrada.":"Suas notas aparecerão aqui. Crie a primeira.";list.append(e);return;}visible.forEach(n=>{const b=document.createElement("button");b.className="note"+(n.id===current?" active":"");const t=document.createElement("strong");t.textContent=n.title||"Sem título";const d=document.createElement("small");d.textContent=stamp(n.updated);b.append(t,d);b.onclick=()=>open(n.id);list.append(b);});}
function blank(){current=null;$("title").value="";$("body").value="";$("remove").disabled=true;$("state").textContent="Nova anotação";$("updated").textContent="Ainda não salva";render();}
function open(id){const n=notes.find(x=>x.id===id);if(!n)return;current=id;$("title").value=n.title;$("body").value=n.body;$("remove").disabled=false;$("state").textContent="Nota salva neste navegador";$("updated").textContent="Última alteração: "+stamp(n.updated);render();}
function save(){const title=$("title").value.trim(),body=$("body").value;if(!title){$("title").focus();toast("Dê um título para sua anotação.");return;}const now=Date.now();if(current){const n=notes.find(x=>x.id===current);if(n){n.title=title;n.body=body;n.updated=now;}}else{current=crypto.randomUUID();notes.push({id:current,title,body,created:now,updated:now});}$("remove").disabled=false;persist();$("state").textContent="Salvo neste navegador";$("updated").textContent="Última alteração: "+stamp(now);render();toast("Página salva com sucesso.");}
function remove(){if(!current||!confirm("Excluir esta anotação?"))return;notes=notes.filter(n=>n.id!==current);persist();blank();toast("Anotação excluída.");}
function exportAll(){if(!notes.length){toast("Não há notas para exportar.");return;}const blob=new Blob([notes.map(n=>"## "+n.title+"\n\n"+n.body).join("\n\n--------------------\n\n")],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="delyone-agenda.txt";a.click();URL.revokeObjectURL(a.href);toast("Arquivo TXT preparado.");}
$("save").onclick=save;$("remove").onclick=remove;$("newTop").onclick=blank;$("newMobile").onclick=blank;$("search").oninput=render;$("exportAll").onclick=exportAll;
$("title").addEventListener("keydown",e=>{if(e.key==="Enter"){$("body").focus();}});load();
})();
</script></body></html>
